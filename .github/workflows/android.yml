name: Android — Build APK + AAB (Play Store ready)

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.json'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync web app into Android assets
        run: bash android/sync-assets.sh

      - name: Build signed release APK + AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --warning-mode all

      - name: Show outputs
        run: |
          ls -la android/app/build/outputs/apk/release/ || true
          ls -la android/app/build/outputs/bundle/release/ || true

      - name: Collect build outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/Mega-Power-AI-v1.2.apk
          cp android/app/build/outputs/bundle/release/*.aab dist/
          ls -la dist/

      # ---------- Real Play Store screenshots (headless Chrome) ----------
      - name: Take Play Store screenshots
        run: |
          cd android/app/src/main/assets/www
          python3 -m http.server 8421 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using browser: $CHROME"
          mkdir -p "$GITHUB_WORKSPACE/playstore/screenshots"
          shot() {
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1080,1920 --force-device-scale-factor=1 \
              --virtual-time-budget=15000 \
              --screenshot="$GITHUB_WORKSPACE/playstore/screenshots/$1.png" \
              "http://127.0.0.1:8421/index.html?$2" || true
          }
          shot phone-hero       "noauth=1"
          shot phone-chat       "noauth=1&demo=answer"
          shot phone-builder    "noauth=1&demo=project"
          shot phone-projects   "noauth=1&open=projects"
          shot phone-settings   "noauth=1&open=settings"
          shot phone-login      "auth=login"
          shot phone-signup     "auth=signup"
          kill $SRV || true
          ls -la "$GITHUB_WORKSPACE/playstore/screenshots/" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mega-power-ai-android
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (APK + AAB + screenshots)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v1.2"
          cat > /tmp/release-notes.md <<'NOTES'
          Mega Power AI v1.2 — clean ChatGPT-style all-in-one chat + Agent mode + real accounts.

          What's new in v1.2:
          - Clean ChatGPT-style interface: flat design, user bubbles, ＋ tools menu, voice input
          - 🤖 AGENT MODE: plans, searches the web, generates images, builds apps — every step shown live
          - Real accounts: separate Login & Sign-up pages, salted-hashed passwords, wrong password = rejected
          - Full Google sign-in flow: account chooser → email → verify/create — never an instant login
          - Log in once — the app opens logged-in every time (until you log out)
          - Update-proof app: network-first service worker + stale-cache purge (no more broken updates)
          - Everything from v1.1: one-box chat, web search with sources, suggestion chips,
            ChatGPT-quality images, 15/30/60s watermark-free videos, 25+ models, searchable settings

          Files:
          - Mega-Power-AI-v1.2.apk — install directly on any Android 7.0+ phone
            (enable Install-unknown-apps, open the file, done)
          - app-release.aab — upload THIS file to Google Play Console, Production, Create release
          - phone-*.png — real Play Store screenshots

          Built with the official Android toolchain by GitHub Actions.
          Created by Umesh Chaudhary. Secret project.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading assets"
            gh release upload "$TAG" dist/*.apk dist/*.aab --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Mega Power AI v1.2 — All-in-one AI Chat + Agent Mode (APK + Play Store AAB)" \
              --notes-file /tmp/release-notes.md \
              dist/*.apk dist/*.aab
          fi
          if ls playstore/screenshots/*.png >/dev/null 2>&1; then
            gh release upload "$TAG" playstore/screenshots/*.png --clobber
          fi
          echo "Release assets now:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
